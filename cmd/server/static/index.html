<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>weekplate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      min-height: 100dvh;
      background:
        radial-gradient(ellipse 80% 60% at 70% -10%, rgba(52,140,90,0.38) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at -10% 80%,  rgba(30,100,60,0.30) 0%, transparent 55%),
        radial-gradient(ellipse 40% 40% at 55% 60%,   rgba(80,180,110,0.10) 0%, transparent 50%),
        linear-gradient(165deg, #091910 0%, #0e2418 30%, #153320 55%, #1c4429 80%, #265737 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      color: #fff;
    }

    .wrap {
      width: 100%;
      max-width: 700px;
      text-align: center;
    }

    /* ── badge ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.13);
      color: rgba(255,255,255,0.6);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.28rem 0.8rem 0.28rem 0.65rem;
      border-radius: 999px;
      margin-bottom: 1.5rem;
      animation: up 0.5s 0.05s both;
    }

    .dot-live {
      width: 6px; height: 6px;
      background: #6fcf97;
      border-radius: 50%;
      animation: live 2.4s ease-in-out infinite;
    }

    @keyframes live {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.35; transform: scale(0.7); }
    }

    /* ── logo ── */
    h1 {
      font-size: clamp(2.8rem, 9vw, 4.6rem);
      font-weight: 600;
      letter-spacing: -0.045em;
      line-height: 1;
      margin-bottom: 0.7rem;
      animation: up 0.5s 0.12s both;
    }

    h1 .g { color: #6fcf97; }

    /* ── tagline ── */
    .sub {
      font-size: clamp(0.88rem, 2.2vw, 1.02rem);
      font-weight: 300;
      color: rgba(255,255,255,0.5);
      line-height: 1.65;
      margin-bottom: 2.75rem;
      animation: up 0.5s 0.2s both;
    }

    /* ── cards ── */
    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      justify-content: center;
      margin-bottom: 2rem;
      animation: up 0.5s 0.3s both;
    }

    .card {
      flex: 0 0 calc((100% - 0.8rem) / 2);
      aspect-ratio: 1;
      background: rgba(255,255,255,0.065);
      border: 1px solid rgba(255,255,255,0.11);
      border-radius: 1.1rem;
      padding: 1.1rem 0.7rem 0.9rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      position: relative;
      overflow: hidden;
      transition:
        transform        0.24s cubic-bezier(0.34,1.56,0.64,1),
        background-color 0.2s ease,
        border-color     0.2s ease,
        box-shadow       0.2s ease;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      user-select: none;
    }

    /* top highlight */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
    }

    /* hover glow overlay */
    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% -10%, rgba(111,207,151,0.18) 0%, transparent 65%);
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    .card:hover {
      transform: translateY(-7px) scale(1.04);
      background-color: rgba(255,255,255,0.11);
      border-color: rgba(111,207,151,0.45);
      box-shadow:
        0 18px 42px rgba(0,0,0,0.45),
        0 0 0 1px rgba(111,207,151,0.18),
        inset 0 1px 0 rgba(255,255,255,0.09);
    }

    .card:hover::after { opacity: 1; }

    .card:active { transform: translateY(-3px) scale(1.02); transition-duration: 0.1s; }

    .card svg {
      width: 50px; height: 50px;
      flex-shrink: 0;
      transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1);
      position: relative;
    }

    .card:hover svg { transform: scale(1.1) translateY(-2px); }

    .label {
      font-size: clamp(0.65rem, 1.6vw, 0.72rem);
      font-weight: 400;
      color: rgba(255,255,255,0.55);
      line-height: 1.38;
      text-align: center;
      transition: color 0.2s ease;
      max-width: 88%;
      position: relative;
    }

    .card:hover .label { color: rgba(255,255,255,0.85); }

    /* ripple on click */
    .ripple {
      position: absolute;
      border-radius: 50%;
      width: 70px; height: 70px;
      background: rgba(111,207,151,0.35);
      transform: scale(0);
      animation: ripple 0.5s ease-out forwards;
      pointer-events: none;
    }

    @keyframes ripple {
      to { transform: scale(3); opacity: 0; }
    }

    @media (min-width: 560px) {
      .card { flex: 0 0 calc((100% - 0.8rem * 4) / 5); }
    }

    /* ── footer ── */
    .note {
      font-size: 0.78rem;
      font-weight: 300;
      color: rgba(255,255,255,0.35);
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      animation: up 0.5s 0.42s both;
    }

    .dot-build {
      width: 6px; height: 6px;
      background: #6fcf97;
      border-radius: 50%;
      animation: live 2.4s 0.6s ease-in-out infinite;
    }

    /* ── shared animation ── */
    @keyframes up {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="badge">
      <span class="dot-live"></span>
      coming soon
    </div>

    <h1>week<span class="g">plate</span></h1>
    <p class="sub">Plan your meals for the week.<br>Get the grocery list. Done.</p>

    <div class="cards">

      <!-- 1 · weekly meal plan -->
      <div class="card">
        <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="11" width="48" height="39" rx="6" fill="rgba(111,207,151,0.09)" stroke="rgba(255,255,255,0.38)" stroke-width="1.8"/>
          <rect x="4" y="11" width="48" height="13" rx="6" fill="rgba(111,207,151,0.22)"/>
          <rect x="4" y="19" width="48" height="5" fill="rgba(111,207,151,0.22)"/>
          <line x1="18" y1="6" x2="18" y2="15" stroke="rgba(255,255,255,0.55)" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="38" y1="6" x2="38" y2="15" stroke="rgba(255,255,255,0.55)" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="12" cy="36" r="4" fill="rgba(111,207,151,0.9)"/>
          <circle cx="21" cy="36" r="4" fill="rgba(111,207,151,0.9)"/>
          <circle cx="30" cy="36" r="4" fill="rgba(111,207,151,0.9)"/>
          <circle cx="39" cy="36" r="4" fill="rgba(111,207,151,0.9)"/>
          <circle cx="12" cy="46" r="4" fill="rgba(255,255,255,0.22)"/>
          <circle cx="21" cy="46" r="4" fill="rgba(255,255,255,0.22)"/>
          <circle cx="30" cy="46" r="4" fill="rgba(255,255,255,0.22)"/>
          <circle cx="39" cy="46" r="4" fill="rgba(255,255,255,0.08)"/>
          <circle cx="48" cy="36" r="4" fill="rgba(255,255,255,0.08)"/>
          <circle cx="48" cy="46" r="4" fill="rgba(255,255,255,0.08)"/>
        </svg>
        <div class="label">Weekly meal plan, calorie-smart</div>
      </div>

      <!-- 2 · food exclusions -->
      <div class="card">
        <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="26" cy="33" r="18" fill="rgba(111,207,151,0.07)" stroke="rgba(255,255,255,0.35)" stroke-width="1.8"/>
          <circle cx="26" cy="33" r="11" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>
          <!-- no-allergen badge -->
          <circle cx="42" cy="17" r="10.5" fill="rgba(200,60,60,0.18)" stroke="rgba(230,100,100,0.48)" stroke-width="1.8"/>
          <ellipse cx="42" cy="17" rx="4.5" ry="6.5" fill="rgba(255,190,120,0.28)" transform="rotate(18 42 17)"/>
          <line x1="42" y1="10" x2="42" y2="8.5" stroke="rgba(255,190,120,0.45)" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="35" y1="10.5" x2="49" y2="23.5" stroke="rgba(240,120,120,0.9)" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
        <div class="label">Food exclusions respected</div>
      </div>

      <!-- 3 · grocery list -->
      <div class="card">
        <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M11 21 L7 50 L49 50 L45 21Z" fill="rgba(111,207,151,0.09)" stroke="rgba(255,255,255,0.38)" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M21 21 C21 13 35 13 35 21" stroke="rgba(255,255,255,0.48)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
          <line x1="17" y1="32" x2="26" y2="32" stroke="rgba(255,255,255,0.3)" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="17" y1="38" x2="30" y2="38" stroke="rgba(255,255,255,0.3)" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="17" y1="44" x2="23" y2="44" stroke="rgba(255,255,255,0.3)" stroke-width="1.8" stroke-linecap="round"/>
          <polyline points="30,29 33,32 39,27" stroke="#6fcf97" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="33,35 36,38 42,33" stroke="#6fcf97" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="27,41 30,44 36,39" stroke="#6fcf97" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="label">Complete grocery list, ready to shop</div>
      </div>

      <!-- 4 · swap meal -->
      <div class="card">
        <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="15" cy="41" rx="12" ry="8" fill="rgba(111,207,151,0.08)" stroke="rgba(255,255,255,0.35)" stroke-width="1.8"/>
          <ellipse cx="15" cy="41" rx="7.5" ry="4.5" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="1.2"/>
          <ellipse cx="41" cy="41" rx="12" ry="8" fill="rgba(111,207,151,0.08)" stroke="rgba(255,255,255,0.35)" stroke-width="1.8"/>
          <ellipse cx="41" cy="41" rx="7.5" ry="4.5" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="1.2"/>
          <path d="M21 25 Q28 17 35 25" stroke="rgba(111,207,151,0.9)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          <polyline points="31,21 35,25 39,22" stroke="rgba(111,207,151,0.9)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M35 33 Q28 41 21 33" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-linecap="round" fill="none"/>
          <polyline points="25,37 21,33 17,36" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="label">Swap a meal, list updates instantly</div>
      </div>

      <!-- 5 · tonight -->
      <div class="card">
        <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="28" cy="36" r="17" fill="rgba(111,207,151,0.07)" stroke="rgba(255,255,255,0.38)" stroke-width="1.8"/>
          <circle cx="28" cy="36" r="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.17)" stroke-width="1.2"/>
          <line x1="8"  y1="23" x2="8"  y2="44" stroke="rgba(255,255,255,0.45)" stroke-width="2"   stroke-linecap="round"/>
          <line x1="6"  y1="23" x2="6"  y2="30" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="10" y1="23" x2="10" y2="30" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M37 9 C34 14 34 22 39 26 C32 26 27 20 30 13 C31 10 34 8 37 9Z" fill="rgba(255,220,90,0.88)"/>
          <circle cx="47" cy="9"  r="1.8" fill="rgba(255,220,90,0.6)"/>
          <circle cx="44" cy="4"  r="1.2" fill="rgba(255,220,90,0.4)"/>
          <circle cx="51" cy="16" r="1"   fill="rgba(255,220,90,0.35)"/>
        </svg>
        <div class="label">See what's for dinner tonight</div>
      </div>

    </div>

    <p class="note">
      <span class="dot-build"></span>
      We're building it right now.
    </p>

  </div>

  <script>
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', function(e) {
        const r = this.getBoundingClientRect();
        const rpl = document.createElement('span');
        rpl.className = 'ripple';
        rpl.style.left = (e.clientX - r.left - 35) + 'px';
        rpl.style.top  = (e.clientY - r.top  - 35) + 'px';
        this.appendChild(rpl);
        rpl.addEventListener('animationend', () => rpl.remove());
      });
    });
  </script>
</body>
</html>
